<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden · My Ally</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A0A0C;color:#F5F5F7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
  main{max-width:34rem}
  h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.03em;line-height:1.05;margin:0 0 16px}
  p{color:#C9C9D1;font-size:18px;line-height:1.55;margin:0 0 32px}
  a{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:12px;background:#7C4DF0;color:#fff;text-decoration:none;font-weight:600}
  a:focus-visible{outline:2px solid #A78BFA;outline-offset:3px}
  .lijn{position:fixed;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#E24D9C 0%,#9695EF 40%,#398FDD 70%,#5FE0D9 100%)}
</style>
</head>
<body>
<main>
  <h1>Deze pagina bestaat niet.</h1>
  <p>Misschien is het adres veranderd, of zat er een tikfout in.</p>
  <a href="/">Naar de voorpagina</a>
</main>
<div class="lijn" aria-hidden="true"></div>
</body>
</html>
