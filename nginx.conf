server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # HSTS: browser gebruikt voortaan alleen https. Zelfde rol als helmet() in de
    # LEET/ECC-backend. Bewust voorzichtig begonnen: 1 dag, zonder includeSubDomains
    # en zonder preload (HSTS is in browsers lastig terug te draaien). Ophogen pas
    # nadat dit een tijd zonder klachten op productie staat.
    # `always` + herhaald in de location hieronder: nginx erft add_header niet
    # naar een location die zelf een add_header heeft.
    add_header Strict-Transport-Security "max-age=86400" always;
    # Beveiligingskoppen: strikte CSP (geen inline scripts op de site), geen framing
    # (clickjacking), geen MIME-sniffing. Ook in de cache-location herhaald (zelfde erfregel).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
