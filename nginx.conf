# Alleen het echte adres mag in Google. Elke andere naam (de testomgeving, www,
# een Coolify-adres) krijgt een noindex-kop. Een lege waarde stuurt nginx niet mee.
# Bewust een toelatingslijst: een nieuwe of vergeten naam is zo nooit per ongeluk vindbaar.
map $host $robots_kop {
    default     "noindex, nofollow";
    myally.nl   "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # www is een tweede kopie van de site: blijvend door naar het echte adres. Vast op
    # https, want achter Traefik ziet nginx zelf alleen http.
    if ($host = www.myally.nl) {
        return 301 https://myally.nl$request_uri;
    }

    # HSTS: browser gebruikt voortaan alleen https. Zelfde rol als helmet() in de
    # LEET/ECC-backend. Bewust voorzichtig begonnen: 1 dag, zonder includeSubDomains
    # en zonder preload (HSTS is in browsers lastig terug te draaien). Ophogen pas
    # nadat dit een tijd zonder klachten op productie staat.
    # `always` + herhaald in de location hieronder: nginx erft add_header niet
    # naar een location die zelf een add_header heeft.
    add_header Strict-Transport-Security "max-age=86400" always;
    # Beveiligingskoppen: strikte CSP (geen inline scripts op de site), geen framing
    # (clickjacking), geen MIME-sniffing. Ook in de cache-location herhaald (zelfde erfregel).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $robots_kop always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Eén pagina: een onbekend adres is een echte 404, niet de voorpagina.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # Voor de rooktest en de waakdienst: antwoordt zelf, zonder add_header (dan erft
    # hij de koppen hierboven).
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_kop always;
    }
}
