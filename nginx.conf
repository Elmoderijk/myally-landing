server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # HSTS: browser gebruikt voortaan alleen https. Zelfde rol als helmet() in de
    # LEET/ECC-backend. Bewust voorzichtig begonnen: 1 dag, zonder includeSubDomains
    # en zonder preload (HSTS is in browsers lastig terug te draaien). Ophogen pas
    # nadat dit een tijd zonder klachten op productie staat.
    # `always` + herhaald in de location hieronder: nginx erft add_header niet
    # naar een location die zelf een add_header heeft.
    add_header Strict-Transport-Security "max-age=86400" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=86400" always;
    }
}
